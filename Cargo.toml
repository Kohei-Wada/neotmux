[workspace]
members = ["neotmux", "neotmux-*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "A terminal multiplexer whose core is pane management and whose everything else is a Lua plugin"
homepage = "https://github.com/Kohei-Wada/neotmux"
readme = "README.md"
keywords = ["terminal", "multiplexer", "tmux", "lua", "tui"]
categories = ["command-line-utilities"]
rust-version = "1.95"
# The crates, which is all this field covers: none of them carries or packages the
# herdr-derived files, which are Apache-2.0 only and live in `runtime/`. See NOTICE.
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kohei-Wada/neotmux"

[workspace.dependencies]
neotmux-proto = { path = "neotmux-proto", version = "0.1.0" }
neotmux-layout = { path = "neotmux-layout", version = "0.1.0" }
neotmux-lua = { path = "neotmux-lua", version = "0.1.0" }
neotmux-pty = { path = "neotmux-pty", version = "0.1.0" }
neotmux-sys = { path = "neotmux-sys", version = "0.1.0" }
neotmux-client = { path = "neotmux-client", version = "0.1.0" }
neotmux-server = { path = "neotmux-server", version = "0.1.0" }
anyhow = "1"
base64 = "0.22"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
nix = { version = "0.28", features = ["term", "signal", "poll", "user", "fs", "process"] }
portable-pty = "0.9"
libc = "0.2"
ratatui = "0.30"
signal-hook = "0.3.18"
tempfile = "3"
unicode-width = "0.2"
vt100 = "0.16"
