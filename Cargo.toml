[workspace]
members = ["crates/neotmux-core", "crates/neotmux-term", "crates/neotmux-lua", "crates/neotmux"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kohei-Wada/neotmux"

[workspace.dependencies]
neotmux-core = { path = "crates/neotmux-core" }
neotmux-lua = { path = "crates/neotmux-lua" }
neotmux-term = { path = "crates/neotmux-term" }
anyhow = "1"
crossterm = "0.29"
mlua = { version = "0.12", features = ["lua54", "vendored"] }
nix = { version = "0.28", features = ["term", "signal"] }
portable-pty = "0.9"
ratatui = "0.30"
signal-hook = "0.3.18"
vt100 = "0.16"
